data:
  data_dir: data
  src_lang: hi
  tgt_lang: mr

tokenizer:
  vocab_size: 32000
  model_prefix: data/spm_himr
  character_coverage: 0.9995

model:
  d_model: 512
  n_layers: 6
  n_heads: 8
  n_kv_heads: 2
  ffn_mult: 4
  dropout: 0.1
  max_seq_len: 128

training:
  seed: 42
  batch_size: 32
  auto_batch_size: true
  grad_accum_steps: 2
  max_steps: 2000
  warmup_steps: 200
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  log_every: 50
  eval_every: 200
  save_every: 500
  num_workers: 2
  amp_dtype: bf16
  output_dir: checkpoints
