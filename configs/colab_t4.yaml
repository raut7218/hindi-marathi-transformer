data:
  data_dir: data
  src_lang: hi
  tgt_lang: mr

tokenizers:
  shared: false
  src:
    vocab_size: 45000
    model_prefix: data/spm_hi_45k
    character_coverage: 0.9995
    model_type: unigram
  tgt:
    vocab_size: 50257
    model_prefix: data/spm_mr_50257
    character_coverage: 0.9995
    model_type: unigram

models:
  encoder:
    d_model: 768
    n_layers: 12
    n_heads: 12
    n_kv_heads: 4
    ffn_dim: 3072
    dropout: 0.1
    max_seq_len: 128
  decoder:
    d_model: 768
    n_layers: 12
    n_heads: 12
    n_kv_heads: 4
    ffn_dim: 3584
    dropout: 0.1
    max_seq_len: 128

training:
  seed: 42
  batch_size: 8
  max_auto_batch_size: 64
  auto_batch_size: true
  grad_accum_steps: 8
  max_steps: 2000
  warmup_steps: 200
  lr: 3.0e-4
  stage_lrs:
    mlm: 3.0e-4
    clm: 3.0e-4
    mt: 1.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  label_smoothing:
    mt: 0.1
  log_every: 25
  eval_every: 200
  save_every: 0
  save_optimizer_state: false
  save_scaler_state: false
  num_workers: 2
  prefetch_factor: 2
  amp_dtype: fp16
  compile: false
  output_dir: checkpoints_colab

distributed:
  enabled: false
  backend: nccl

evaluation:
  batch_size: 8
  loss_batch_size: 8
  loss_batches: 20
  sample_train: 128
  sample_valid: 128
  final_samples: 0
  checkpoint:

mt:
  encoder_checkpoint: checkpoints_colab/mlm/encoder_mlm_final_step2000.pt
  decoder_checkpoint: checkpoints_colab/clm/decoder_clm_final_step2000.pt
  freeze_pretrained: false
  cross_only_steps: 300
  pretrained_lr_mult: 0.3
