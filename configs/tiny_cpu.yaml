data:
  data_dir: data
  src_lang: hi
  tgt_lang: mr

tokenizers:
  shared: false
  src:
    vocab_size: 512
    model_prefix: data/test_spm_hi_512
    character_coverage: 0.9995
    model_type: unigram
    input_sentence_size: 5000
  tgt:
    vocab_size: 512
    model_prefix: data/test_spm_mr_512
    character_coverage: 0.9995
    model_type: unigram
    input_sentence_size: 5000

models:
  encoder:
    d_model: 64
    n_layers: 2
    n_heads: 4
    n_kv_heads: 2
    ffn_dim: 128
    dropout: 0.1
    max_seq_len: 32
  decoder:
    d_model: 64
    n_layers: 2
    n_heads: 4
    n_kv_heads: 2
    ffn_dim: 160
    dropout: 0.1
    max_seq_len: 32

training:
  seed: 42
  batch_size: 2
  max_auto_batch_size: 2
  auto_batch_size: false
  grad_accum_steps: 1
  max_steps: 1
  warmup_steps: 1
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  log_every: 1
  eval_every: 100
  save_every: 100
  num_workers: 0
  amp_dtype: fp32
  compile: false
  output_dir: checkpoints_tiny

evaluation:
  batch_size: 2
  loss_batch_size: 2
  loss_batches: 1
  sample_train: 2
  sample_valid: 2
  final_samples: 2
  checkpoint:

mt:
  encoder_checkpoint:
  decoder_checkpoint:
  freeze_pretrained: false
